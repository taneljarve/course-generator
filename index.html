<!DOCTYPE html>
<html lang="et">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Kursusegeneraator</title>
    <meta name="description" content="AI-powered course generator" />
    <link rel="stylesheet" href="/vendor/github-markdown-dark.css" />
    <link rel="stylesheet" href="/styles.css" />
    <script src="/app.js" defer></script>
  </head>
  <body>
    <div class="shell">
      <!-- Top Header -->
      <header class="topbar">
        <div class="brand">
          <div class="brand-mark">K</div>
          <div>
            <h1>Kursusegeneraator</h1>
            <p>AI-powered learning</p>
          </div>
        </div>

        <div class="topbar-meta">
          <div class="status-indicator">
            <span class="status-dot" id="status-dot"></span>
            <span id="api-status-chip">-</span>
          </div>
          <button type="button" class="small" id="ai-toggle">AI</button>
          <div class="lang-toggle" aria-label="Keel">
            <button type="button" class="small" data-site-lang="et">EST</button>
            <button type="button" class="small" data-site-lang="en">ENG</button>
          </div>
        </div>
      </header>

      <!-- Main Workspace -->
      <main class="workspace">
        <!-- Left Explorer Sidebar -->
        <aside class="sidebar">
          <!-- Generator Section -->
          <section class="generator-section">
            <form id="generate-form" class="generator-form">
              <div class="field">
                <label id="topic-label">Teema</label>
                <select id="topic-select">
                  <option value=" AML fundamentals">AML Fundamentals</option>
                  <option value="Excel for beginners">Excel for Beginners</option>
                  <option value="Python basics">Python Basics</option>
                  <option value="Driving theory">Driving Theory</option>
                  <option value="custom">Custom...</option>
                </select>
              </div>
              <div class="field hidden" id="custom-topic-field">
                <input type="text" id="topic-custom" placeholder="Teema..." />
              </div>
              <div class="field-row">
                <div class="field">
                  <label id="language-label">Keel</label>
                  <select id="language">
                    <option value="Eesti">Est</option>
                    <option value="English">Eng</option>
                  </select>
                </div>
                <div class="field">
                  <label id="days-label">Päevad</label>
                  <input id="days" type="number" value="5" min="1" max="30" />
                </div>
              </div>
              <button type="submit" class="primary" id="generate-button">Genereeri</button>
            </form>
          </section>

          <!-- File Explorer -->
          <div class="sidebar-tabs">
            <button class="sidebar-tab active">Files</button>
            <button class="sidebar-tab">Search</button>
          </div>

          <div class="explorer">
            <!-- Language Folders -->
            <div class="explorer-section">
              <div class="explorer-header">
                <span>📁 Kaustad</span>
              </div>
              <div id="library-tree"></div>
            </div>
          </div>
        </aside>

        <!-- Main Content -->
        <section class="main-content">
          <!-- File Header -->
          <div class="file-header">
            <div class="breadcrumb">
              <span class="breadcrumb-item" id="viewer-path">-</span>
            </div>
            <div class="file-actions">
              <button type="button" class="file-tab active" data-view-mode="preview">Preview</button>
              <button type="button" class="file-tab" data-view-mode="raw">Raw</button>
              <button type="button" class="small" id="download-file-button" disabled>↓</button>
            </div>
          </div>

          <!-- Content Area -->
          <div class="content">
            <div id="empty-state" class="empty-state">
              <h2>Vali kursus</h2>
              <p>Vali vasakult või genereeri uus</p>
            </div>
            <article id="markdown-preview" class="markdown-body markdown-surface hidden"></article>
            <pre id="markdown-raw" class="hidden"></pre>
          </div>
        </section>
      </main>
    </div>

    <div id="toast" class="toast" aria-live="polite"></div>
  </body>
</html>
